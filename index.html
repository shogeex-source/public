<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="時刻表カウントダウン">
<meta name="description" content="終電・始発までの残り時間を表示するカウントダウンアプリ">
<title>時刻表カウントダウン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: スマホ全画面の1カラムアプリ。PCでは中央に最大520pxで表示 */
:root {
  --page: #e9e3f0; --surface: #fdf8ff; --surface-2: #efe8f7; --on-surface: #1d1a22; --on-variant: #49454f; --outline: #7a757f;
  --primary: #6750a4; --on-primary: #ffffff; --primary-cont: #e9ddff; --on-primary-cont: #22005d;
  --error: #ba1a1a; --alarm: #e0201b; --warn: #d9480f; --yellow: #e6a700; --scrim: rgb(0 0 0 / .36);
  --g1: #5b3fa8; --g2: #9b4fae;
  --f-app: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0b0a0d; --surface: #141218; --surface-2: #2a2630; --on-surface: #e7e0e8; --on-variant: #cac4cf; --outline: #948f99;
  --primary: #cfbcff; --on-primary: #381e72; --primary-cont: #4f378b; --on-primary-cont: #e9ddff;
  --error: #ffb4ab; --alarm: #ff4d45; --warn: #ffa94d; --yellow: #ffe03a; --scrim: rgb(0 0 0 / .55); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0b0a0d; --surface: #141218; --surface-2: #2a2630; --on-surface: #e7e0e8; --on-variant: #cac4cf; --outline: #948f99;
  --primary: #cfbcff; --on-primary: #381e72; --primary-cont: #4f378b; --on-primary-cont: #e9ddff;
  --error: #ffb4ab; --alarm: #ff4d45; --warn: #ffa94d; --yellow: #ffe03a; --scrim: rgb(0 0 0 / .55); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
:root { color-scheme: light; }
html, body { height: 100%; }
body { background: var(--page); color: var(--on-surface); font-family: var(--f-app); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; background: var(--surface); overflow: hidden; }
@media (min-width: 560px) { #app { box-shadow: 0 0 40px rgb(0 0 0 / .12); } }
#layer { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; pointer-events: none; z-index: 50; }
#layer > * { pointer-events: auto; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); animation: slide .2s ease-out;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.screen.still { animation: none; }
@keyframes slide { from { transform: translateX(20px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .screen, .menu, .dialog, .sheet, .pw-scrim, .ring-wrap, .toast { animation: none !important; } }

.appbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: env(safe-area-inset-top, 0px) 4px 0 16px; }
.appbar.has-back { padding-left: 4px; }
.appbar-title { flex: 1; min-width: 0; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* アプリ名：書体・色はほかと同じ。太さと字間で少しだけ強弱をつける */
.brand { font-size: 19px; letter-spacing: .02em; color: var(--on-surface); }
.icon-btn { width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: var(--on-variant);
  display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:active { background: color-mix(in srgb, var(--on-surface) 10%, transparent); }
svg { width: 24px; height: 24px; fill: currentColor; }
button:focus-visible, .tile:focus-visible, input:focus-visible, .wheel:focus-visible, .hero:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.text-btn { border: 0; background: transparent; color: var(--primary); font: 500 15px var(--f-app); padding: 10px 14px; border-radius: 20px; cursor: pointer; }
.text-btn:disabled { color: color-mix(in srgb, var(--on-surface) 38%, transparent); cursor: default; }
.body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* 共通：Proバッジ・緊急度 */
.pro-badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 6px; font: 700 10px var(--f-app); letter-spacing: .06em;
  color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); vertical-align: middle; margin-left: 6px; flex: none; }
.pro-pill { height: 32px; padding: 0 12px 0 8px; border: 0; border-radius: 16px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff;
  font: 700 12px var(--f-app); letter-spacing: .06em; display: flex; align-items: center; gap: 4px; cursor: pointer; margin-right: 2px; flex: none; }
/* 一覧画面右上のPROボタン：黒の地に金色の文字・王冠・縁取り */
.pro-pill { background: #000; color: #ffd54a; border: 1px solid rgb(255 213 74 / .7);
  box-shadow: 0 0 10px rgb(255 213 74 / .18); }
.pro-pill svg { width: 16px; height: 16px; color: #ffd54a; }
/* 残り時間の色はすべて紫で統一（急ぎ具合はリングの長さと残り3分の鼓動で伝える） */
.calm, .warn, .alarm { --u: var(--primary); }

/* ① リスト */
.home { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.hero { margin: 4px 16px 12px; padding: 18px 20px 20px; border-radius: 24px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff;
  cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 8px 24px color-mix(in srgb, var(--g1) 35%, transparent); }
.hero::after { content: ''; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px; border-radius: 50%; background: rgb(255 255 255 / .09); pointer-events: none; }
.hero-k { font-size: 12px; opacity: .85; letter-spacing: .04em; }
.hero-t { margin-top: 4px; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-cd { margin-top: 10px; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
.hero-cd small, .cd-main small { font-size: .45em; font-weight: 500; margin: 0 .2em 0 .05em; }
.hero-sub { margin-top: 6px; font-size: 13px; opacity: .92; }
#list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 0 16px; }
.tile { height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; cursor: pointer; border-radius: 14px;
  background: color-mix(in srgb, var(--primary-cont) 38%, var(--surface)); border: 1px solid color-mix(in srgb, var(--primary) 12%, transparent);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; position: relative; }
.tile:active, .tile.pressing { background: color-mix(in srgb, var(--primary-cont) 70%, var(--surface)); }
.tile.pressing { transition: background .5s; }
.tile.lifted { z-index: 3; background: var(--surface-2); box-shadow: 0 8px 22px rgb(0 0 0 / .25); }
.tile-title { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-chip { flex: none; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 10px; font-variant-numeric: tabular-nums;
  color: var(--u); background: color-mix(in srgb, var(--u) 14%, transparent); }
.tile-time { flex: none; font-size: 14px; color: var(--on-variant); font-variant-numeric: tabular-nums; }
.tile svg { color: var(--on-variant); flex: none; }
.tile.locked .tile-title, .tile.locked .tile-time { opacity: .5; }
.tile.locked svg { color: var(--primary); width: 20px; height: 20px; margin: 0 2px; }
/* 色分け（Pro）：項目の左端に色の帯 */
.tile.tagged { background: var(--tag); border-color: transparent; color: #fff; }
.tile.tagged .tile-time, .tile.tagged svg { color: rgb(255 255 255 / .9); }
.tile.tagged:active, .tile.tagged.pressing { background: color-mix(in srgb, var(--tag) 82%, #000); }
.colors { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); display: grid; place-items: center; color: #fff; padding: 0; }
.cbtn.none { background: transparent; border: 2px dashed var(--outline); color: var(--on-variant); }
.cbtn.on { outline: 3px solid var(--on-surface); outline-offset: 2px; }
.cbtn svg { width: 16px; height: 16px; }
/* 広告枠（無料版のみ。Proで非表示） */
.ad { margin: 16px 16px 0; height: 56px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px;
  position: relative; text-align: center;
  background: color-mix(in srgb, var(--on-surface) 6%, var(--surface)); color: var(--on-variant); font-size: 13px; }
.ad-tag { position: absolute; top: 8px; left: 8px; font-size: 10px; padding: 1px 5px; border: 1px solid var(--outline); border-radius: 4px; }
.ad .grow { min-width: 0; }
.ad .link { color: #ffd54a; flex: none; }
:root[data-theme="light"] .ad .link { color: #b8860b; }
.empty { padding: 72px 24px; text-align: center; color: var(--on-variant); line-height: 1.7; }
.quota { padding: 20px 16px 8px; text-align: center; font-size: 15px; color: var(--on-variant); }
.quota .link { font-size: 15px; color: #ffd54a; }
:root[data-theme="light"] .quota .link { color: #b8860b; }   /* ライトでは白地で読める濃い黄色 */
#to-settings svg { width: 30px; height: 30px; }
#gear svg { width: 28px; height: 28px; }
#mode-btn svg { width: 26px; height: 26px; }
.appbar:not(.has-back) .icon-btn { width: 42px; }
/* 一覧画面の上部：左にPRO、中央にアプリ名、右に歯車（PROと歯車を離して押し間違いを防ぐ） */
.home-bar { display: grid; grid-template-columns: 1fr auto 1fr; padding-left: 10px; padding-right: 10px; }
.home-bar .pro-pill { justify-self: start; }
.home-bar .brand { text-align: center; max-width: calc(100vw - 168px); }
.home-bar #to-settings { justify-self: end; }
@media (max-width: 375px) { .brand { font-size: 17px; } .appbar:not(.has-back) .icon-btn { width: 38px; } }
/* さらに小さい画面：PROボタンを少し詰め、アプリ名を小さくして省略させない */
@media (max-width: 350px) { .brand { font-size: 15px; letter-spacing: 0; } .home-bar .pro-pill { padding: 0 8px 0 6px; font-size: 11px; } .home-bar { padding-left: 6px; padding-right: 6px; } }   /* 幅の狭いスマホでもアプリ名を省略しない */
.link { border: 0; background: none; color: var(--primary); font: 500 13px var(--f-app); cursor: pointer; padding: 4px; }
.fab { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--primary-cont); color: var(--on-primary-cont);
  display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 8px rgb(0 0 0 / .22); }

/* ② カウントダウン */
.cd { flex: 1; display: grid; place-items: center; padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px)); text-align: center; overflow-y: auto; }
.cd-inner { display: grid; justify-items: center; max-width: 100%; }
.cd-title { font-size: 22px; line-height: 1.4; text-wrap: balance; }
.ring-wrap { position: relative; margin-top: 20px; width: min(84vw, 330px); aspect-ratio: 1; display: grid; place-items: center; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring circle { fill: none; stroke-width: 7; }
/* 1周＝60分の目盛り（5分ごと、15分ごとに太線と数字） */
.tick { stroke: color-mix(in srgb, var(--outline) 55%, transparent); stroke-width: 1; stroke-linecap: round; }
.tick.major { stroke: var(--on-variant); stroke-width: 1.8; }
.tick-l { font: 500 7.5px var(--f-app); fill: var(--on-variant); dominant-baseline: central; }
.ring-bg { stroke: color-mix(in srgb, var(--primary) 20%, var(--surface)); }
.ring-fg { stroke: var(--u); stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .4s; }
.ring-wrap.alarm .ring-fg { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--primary) 55%, transparent)); }
.ring-wrap.hot { animation: beat 1s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.025); } }
.ring-text { position: relative; display: grid; justify-items: center; gap: 6px; padding: 0 10%; }
.ring-label { font-size: 13px; color: var(--on-variant); letter-spacing: .04em; }
.ring-label.go { color: var(--primary); font-weight: 700; font-size: 15px; }
.cd-main { font-size: clamp(24px, 8vw, 36px); font-weight: 700; white-space: nowrap; color: var(--on-surface); font-variant-numeric: tabular-nums;
  letter-spacing: -.01em; line-height: 1.1; }
.cd-main.miss { color: var(--primary); font-size: clamp(26px, 8vw, 36px); }
.cd-sub { margin-top: 16px; font-size: 14px; color: var(--outline); line-height: 1.6; }
.cd-note { margin-top: 4px; font-size: 12px; color: var(--outline); }
.cd-extra { margin-top: 20px; min-height: 40px; display: grid; justify-items: center; }
.hint-chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 20px;
  border: 1px solid color-mix(in srgb, var(--outline) 50%, transparent); background: transparent; color: var(--on-surface); font: 500 14px var(--f-app); cursor: pointer; }
.hint-chip svg { width: 18px; height: 18px; color: var(--primary); }
.hint-chip .pro-badge { margin-left: 0; }
.upsell { max-width: 320px; padding: 16px 18px; border-radius: 20px; background: var(--surface-2); text-align: left; display: grid; gap: 8px; }
.upsell b { font-size: 15px; font-weight: 500; }
.upsell p { margin: 0; font-size: 13px; color: var(--on-variant); line-height: 1.6; }
.upsell .cta { height: 44px; margin-top: 6px; font-size: 14px; }
.menu { position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); z-index: 10;
  min-width: 168px; padding: 8px 0; border-radius: 4px; background: var(--surface-2); box-shadow: 0 6px 20px rgb(0 0 0 / .22);
  animation: pop .15s ease-out; transform-origin: top right; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.menu button { width: 100%; height: 48px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; font: 400 16px var(--f-app); color: var(--on-surface); cursor: pointer; }
.menu .danger { color: var(--error); }
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 24px; }
.dialog { width: 100%; max-width: 320px; background: var(--surface-2); border-radius: 28px; padding: 24px 24px 16px; animation: pop .15s ease-out; transform-origin: center; }
.dialog h2 { margin: 0 0 12px; font-size: 22px; font-weight: 400; }
.dialog p { margin: 0 0 20px; font-size: 14px; color: var(--on-variant); line-height: 1.6; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 4px; }
.dialog .del { color: var(--error); }
.dialog textarea { width: 100%; height: 110px; margin: 0 0 16px; padding: 8px 10px; border: 1px solid var(--outline); border-radius: 8px;
  background: transparent; color: var(--on-surface); font: 12px/1.5 ui-monospace, Menlo, monospace; resize: none; word-break: break-all; }
.dialog .actions { flex-wrap: wrap; }

/* ③ 編集 */
.edit { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; align-content: start; }
.field { display: grid; gap: 4px; }
.field span { font-size: 12px; color: var(--primary); padding-left: 4px; }
.field input { height: 54px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 14px; font: 400 16px var(--f-app);
  background: transparent; color: var(--on-surface); width: 100%; }
.field input:focus { border-color: var(--primary); outline: 2px solid var(--primary); outline-offset: -2px; }
.lbl { margin-top: 32px; font-size: 14px; font-weight: 500; display: flex; align-items: center; }
.picker { position: relative; margin-top: 8px; height: 180px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.picker-band { position: absolute; left: 8px; right: 8px; top: 72px; height: 36px; border-radius: 8px; background: color-mix(in srgb, var(--on-surface) 7%, transparent); pointer-events: none; }
.wheel { position: relative; z-index: 1; width: 80px; height: 180px; overflow-y: scroll; scroll-snap-type: y mandatory; padding-block: 72px;
  scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wi { height: 36px; display: grid; place-items: center; scroll-snap-align: center; font-size: 22px; color: var(--on-variant);
  font-variant-numeric: tabular-nums; cursor: pointer; user-select: none; }
.wi.sel { color: var(--on-surface); font-weight: 500; }
.colon { position: relative; z-index: 1; font-size: 22px; font-weight: 500; }
.stepper { margin-top: 10px; display: flex; align-items: center; gap: 16px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--outline); background: transparent; color: var(--on-surface);
  font: 500 22px var(--f-app); cursor: pointer; }
.stepper output { min-width: 72px; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--on-variant); line-height: 1.6; }
.locked-row { margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 12px;
  border: 1px dashed var(--outline); background: transparent; color: var(--on-surface); font: 400 15px var(--f-app); cursor: pointer; text-align: left; }
.locked-row .grow { flex: 1; }
.locked-row svg { color: var(--primary); flex: none; }
.filled { margin-top: 28px; height: 44px; border: 0; border-radius: 22px; background: var(--primary); color: var(--on-primary);
  font: 500 15px var(--f-app); cursor: pointer; }
.filled:disabled { background: color-mix(in srgb, var(--on-surface) 12%, transparent); color: color-mix(in srgb, var(--on-surface) 38%, transparent); cursor: default; }

/* ④ 設定 */
.settings { padding: 8px 0 calc(32px + env(safe-area-inset-bottom, 0px)); }
.pro-card { margin: 8px 16px; width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; padding: 16px; border: 0; border-radius: 20px;
  background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; text-align: left; font-family: var(--f-app); }
button.pro-card { cursor: pointer; }
.pro-card div { flex: 1; display: grid; gap: 2px; }
.pro-card b { font-size: 16px; }
.pro-card span { font-size: 12px; opacity: .9; }
.pro-card svg { flex: none; }
.pro-card > svg:first-child { color: #fff; width: 30px; height: 30px; }
.sec { padding: 22px 20px 6px; font-size: 13px; font-weight: 500; color: var(--primary); }
.row { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 10px 20px; border: 0; background: transparent;
  color: var(--on-surface); font: 400 16px var(--f-app); text-align: left; }
button.row { cursor: pointer; }
button.row:active { background: color-mix(in srgb, var(--on-surface) 7%, transparent); }
.row.col { flex-direction: column; align-items: stretch; }
.row-i { color: var(--on-variant); flex: none; display: grid; }
.row-t { flex: 1; min-width: 0; }
.row > svg:last-child { color: var(--outline); flex: none; }
.row-val { color: var(--on-variant); font-size: 14px; flex: none; }
.row-t small { display: block; margin-top: 2px; font-size: 12px; color: var(--on-variant); }
.switch { flex: none; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-2); border: 2px solid var(--outline); position: relative; transition: .2s; }
.switch::after { content: ''; position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--outline); transition: .2s; }
.switch.on { background: var(--primary); border-color: var(--primary); }
.switch.on::after { left: 22px; width: 24px; height: 24px; margin-top: -12px; background: var(--on-primary); }
.seg { display: flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; flex: none; }
.seg button { height: 36px; padding: 0 14px; border: 0; background: transparent; color: var(--on-surface); font: 500 13px var(--f-app); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--outline); }
.seg button.on { background: var(--primary-cont); color: var(--on-primary-cont); }
.seg-wrap { padding: 0 20px 10px 58px; }
.seg-wrap .seg button { flex: 1; padding: 0 4px; white-space: nowrap; }
.swatches { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
.sw { display: grid; justify-items: center; gap: 6px; border: 0; background: none; color: var(--on-variant); font: 400 12px var(--f-app); cursor: pointer; padding: 0; }
.sw i { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b)); display: grid; place-items: center; color: #fff; }
.sw.on i { outline: 3px solid var(--primary); outline-offset: 3px; }
.sw i svg { width: 18px; height: 18px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 12px 58px; }
.chip-sel { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--outline); background: transparent; color: var(--on-surface); font: 500 13px var(--f-app); cursor: pointer; }
/* 利用規約・プライバシーポリシー・お問い合わせ */
.doc { padding: 8px 20px calc(40px + env(safe-area-inset-bottom, 0px)); font-size: 14px; line-height: 1.85; color: var(--on-variant); }
.doc h3 { margin: 22px 0 4px; font-size: 15px; font-weight: 500; color: var(--on-surface); }
.doc p { margin: 0 0 6px; }
.doc ol, .doc ul { margin: 0 0 6px; padding-left: 1.4em; }
.doc .meta { margin-top: 28px; font-size: 13px; text-align: right; }
.contact { padding: 8px 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; align-content: start; }
.contact .lead { margin: 0; font-size: 14px; line-height: 1.7; color: var(--on-variant); }
.contact .chips { padding: 0; }
.contact textarea { height: 170px; border: 1px solid var(--outline); border-radius: 4px; padding: 12px 14px; font: 400 16px/1.6 var(--f-app);
  background: transparent; color: var(--on-surface); width: 100%; resize: vertical; }
.contact textarea:focus { border-color: var(--primary); outline: 2px solid var(--primary); outline-offset: -2px; }
.contact .filled { margin-top: 0; }
.contact .hint { margin: -10px 0 0; }
.chip-sel.on { background: var(--primary-cont); color: var(--on-primary-cont); border-color: transparent; }

.pw-scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface);
  border-radius: 28px 28px 0 0; animation: up .3s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.closing { transform: translateY(100%); transition: transform .2s ease-in; }
@keyframes up { from { transform: translateY(100%); } }
.pw-hero { position: relative; padding: 36px 24px 26px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; text-align: center; overflow: hidden; }
.pw-hero::before { content: ''; position: absolute; left: -60px; bottom: -90px; width: 230px; height: 230px; border-radius: 50%; background: rgb(255 255 255 / .08); }
.pw-close { position: absolute; top: 6px; right: 6px; color: #fff; }
.pw-crown { position: relative; width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 18px; background: rgb(255 255 255 / .18); display: grid; place-items: center; }
.pw-crown svg { width: 32px; height: 32px; color: #fff; }
.pw-hero h2 { position: relative; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.pw-hero p { position: relative; margin: 8px 0 0; font-size: 14px; opacity: .92; line-height: 1.6; }
.pw-reason { position: relative; display: inline-block; margin-top: 14px; padding: 6px 12px; border-radius: 14px; background: rgb(0 0 0 / .22); font-size: 12px; }
.pw-body { padding: 22px 20px 20px; }
.benefits { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.benefits li { display: flex; gap: 14px; align-items: center; }

.benefits i svg { width: 22px; height: 22px; }
.benefits b { display: block; font-size: 15px; font-weight: 500; }
.benefits span { font-size: 12px; color: var(--on-variant); }
.plans { display: grid; gap: 12px; margin-top: 26px; }
.plan { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 16px;
  border: 2px solid color-mix(in srgb, var(--outline) 40%, transparent); background: transparent; color: var(--on-surface); text-align: left; cursor: pointer; font-family: var(--f-app); }
.plan.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary-cont) 45%, transparent); }
.radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--outline); display: grid; place-items: center; }
.plan.on .radio { border-color: var(--primary); }
.plan.on .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.plan-main { flex: 1; min-width: 0; }
.plan-main b { display: block; font-size: 15px; font-weight: 500; }
.plan-main span { font-size: 12px; color: var(--on-variant); }
.plan-price { flex: none; text-align: right; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.plan-price small { font-size: 11px; font-weight: 400; color: var(--on-variant); }
.plan-badge { position: absolute; top: -10px; left: 14px; padding: 2px 10px; border-radius: 10px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; font-size: 11px; font-weight: 700; }
.cta { width: 100%; margin-top: 20px; height: 54px; border: 0; border-radius: 27px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff;
  font: 700 16px var(--f-app); cursor: pointer; box-shadow: 0 6px 18px color-mix(in srgb, var(--g1) 40%, transparent); }
.cta:disabled { opacity: .7; cursor: default; }
.fine { margin: 10px 4px 0; font-size: 11px; color: var(--on-variant); text-align: center; line-height: 1.6; }
.pw-links { display: flex; justify-content: center; margin-top: 4px; }
.demo-note { text-align: center; font-size: 11px; color: var(--outline); }

/* ホーム画面への追加の案内 */
.a2hs { position: absolute; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; gap: 12px; align-items: center;

.a2hs img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.a2hs div { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; color: var(--on-variant); }
.a2hs b { display: block; font-size: 14px; color: var(--on-surface); font-weight: 500; }

.toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);

  // ---------- 計算 ----------

  function dial() {

  function wheel(el, count, value, onChange) {
    const H = 36;
    el.innerHTML = Array.from({ length: count }, (_, i) => `<div class="wi">${pad(i)}</div>`).join('');
    let cur = value;
    const mark = () => el.querySelectorAll('.wi').forEach((w, i) => w.classList.toggle('sel', i === cur));
    requestAnimationFrame(() => { el.scrollTop = value * H; mark(); });
    el.addEventListener('scroll', () => {
      const v = Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / H)));
      if (v !== cur) { cur = v; mark(); onChange(v); }
    });
    el.addEventListener('click', e => {
      const w = e.target.closest('.wi');
      if (w) el.scrollTo({ top: [...el.children].indexOf(w) * H, behavior: 'smooth' });
    });
    el.addEventListener('keydown', e => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      el.scrollTo({ top: Math.max(0, Math.min(count - 1, cur + (e.key === 'ArrowDown' ? 1 : -1))) * H, behavior: 'smooth' });
    });
    mark();
  }

    return JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g, '')))));
  }
  function dialog(html) {
    const w = document.createElement('div');
    w.className = 'scrim'; w.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
    layer.appendChild(w);
    w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) w.remove(); });
    return w;
  }
  function exportDialog() {
    const code = encode({ app: 'timetable-countdown', v: 1, items });
    const w = dialog(`<h2>データを書き出す</h2>
      <p>このコードを新しい端末の「読み込む」に貼り付けると、タイマー${items.length}件を引き継げます。</p>
      <textarea readonly aria-label="引き継ぎコード">${esc(code)}</textarea>
      <div class="actions"><button class="text-btn" id="bk-file">ファイルで保存</button><button class="text-btn" id="bk-copy">コピー</button><button class="text-btn" data-close>閉じる</button></div>`);
    const ta = $('textarea', w);
    $('#bk-copy', w).onclick = async () => {
      try { await navigator.clipboard.writeText(code); toast('コピーしました'); }
      catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('コピーしました'); } catch (e2) { toast('コードを長押ししてコピーしてください'); } }
    };
    $('#bk-file', w).onclick = () => {
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
        a.download = `timetable-backup-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { toast('ファイルを保存できませんでした。コピーをお使いください'); }
    };
  }
  function importDialog() {
    const w = dialog(`<h2>データを読み込む</h2>
      <p>書き出したコードを貼り付けてください。今あるタイマーに追加されます（同じタイマーは上書き）。</p>
      <textarea aria-label="引き継ぎコード" placeholder="ここに貼り付け"></textarea>
      <div class="actions"><button class="text-btn" data-close>キャンセル</button><button class="text-btn" id="bk-go">読み込む</button></div>`);
    $('#bk-go', w).onclick = () => {
      let data;
      try { data = decode($('textarea', w).value); } catch (e) { return toast('コードを読み取れませんでした'); }
      const list = Array.isArray(data) ? data : data && data.items;
      if (!Array.isArray(list)) return toast('コードを読み取れませんでした');
      const num = (v, max) => Math.max(0, Math.min(max, Math.floor(Number(v) || 0)));
      let count = 0;
      for (const it of list) {
        if (!it || typeof it.title !== 'string' || !it.title.trim()) continue;
        const clean = { id: typeof it.id === 'string' && it.id ? it.id.slice(0, 40) : 'u' + Date.now() + count,
          title: it.title.trim().slice(0, 100), hour: num(it.hour, 23), minute: num(it.minute, 59), second: num(it.second, 59),
          color: COLORS[it.color] ? it.color : 'none' };
        const i = items.findIndex(x => x.id === clean.id);
        if (i >= 0) items[i] = clean; else items.push(clean);
        count++;
      }
      if (!count) return toast('読み込めるタイマーがありませんでした');
      persist(); w.remove(); rerender(); toast(`タイマー${count}件を読み込みました`);
    };
  }

  // ---------- 1秒ごとの更新（アプリに戻ったときも即座に再計算） ----------
  function tick() {
    const v = top();
    if (v.name === 'countdown') updateCountdown();
    else if (v.name === 'list' && !(press && press.active)) updateList();
  }
  let lastSec = -1;
  setInterval(() => { const s = Math.floor(Date.now() / 1000); if (s !== lastSec) { lastSec = s; tick(); } }, 200);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  // ---------- オフライン対応（PWA）とホーム画面への追加の案内 ----------
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; maybeA2HS(); });
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let opens = 0;
  try { opens = Number(localStorage.getItem('timetable-web-opens') || 0) + 1; localStorage.setItem('timetable-web-opens', String(opens)); } catch (e) {}
  function maybeA2HS() {
    // 3回目以降に開いたとき、一度だけ表示（ホーム画面から開いている場合は出さない）
    let done = false;
    try { done = !!localStorage.getItem('timetable-web-a2hs'); } catch (e) {}
    if (done || opens < 3 || standalone() || layer.querySelector('.a2hs')) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!installEvt && !ios) return;
    const el = document.createElement('div');
    el.className = 'a2hs'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'ホーム画面に追加');
    el.innerHTML = `<img src="icons/icon-192.png" alt=""><div><b>ホーム画面に追加しませんか？</b>${installEvt
      ? 'アプリのように開けて、電波がなくても使えます。'
      : '共有ボタン（□に↑）から「ホーム画面に追加」を選ぶと、アプリのように開けて電波がなくても使えます。'}</div>
      ${installEvt ? '<button class="text-btn" id="a2-add">追加</button>' : ''}<button class="text-btn" id="a2-no">閉じる</button>`;
    layer.appendChild(el);
    const close = () => { el.remove(); try { localStorage.setItem('timetable-web-a2hs', '1'); } catch (e) {} };
    $('#a2-no', el).onclick = close;
    const add = $('#a2-add', el);
    if (add) add.onclick = async () => { close(); try { installEvt.prompt(); await installEvt.userChoice; } catch (e) {} installEvt = null; };
  }
  setTimeout(maybeA2HS, 2500);

  render();
})();
</script>
</body>
</html>
